---
- name: Ensure Excalidraw paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ excalidraw_uid }}"
    group: "{{ excalidraw_gid }}"
  with_items:
    - "{{ excalidraw_base_path }}"

- name: Ensure Excalidraw support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ excalidraw_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ excalidraw_uid }}"
    group: "{{ excalidraw_gid }}"
  with_items:
    - env
    - labels
  register: excalidraw_support_files_result

- name: Run if self-building of Excalidraw container image is not enabled
  when: "not excalidraw_container_image_self_build | bool"
  block:
    - name: Ensure Excalidraw container image is pulled via community.docker.docker_image_pull
      when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
      community.docker.docker_image_pull:
        name: "{{ excalidraw_container_image }}"
        pull: always
      register: excalidraw_container_image_pull_result_ansible_module
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: excalidraw_container_image_pull_result_ansible_module is not failed

    - name: Ensure Excalidraw container image is pulled via ansible.builtin.command
      when: devture_systemd_docker_base_container_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ excalidraw_container_image }}"
      register: excalidraw_container_image_pull_result_command
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: excalidraw_container_image_pull_result_command is not failed
      changed_when: "'Downloaded newer image' in excalidraw_container_image_pull_result_command.stdout"

- name: Run if self-building of Excalidraw container image is enabled
  when: "excalidraw_container_image_self_build | bool"
  block:
    - name: Ensure Excalidraw repository is present on self-build
      ansible.builtin.git:
        repo: "{{ excalidraw_container_image_self_build_repo }}"
        version: "{{ excalidraw_container_image_self_build_repo_version }}"
        dest: "{{ excalidraw_container_image_self_build_src_files_path }}"
        force: "yes"
      register: excalidraw_git_pull_results

    - name: Ensure Excalidraw files for building container image installed
      ansible.builtin.template:
        src: "{{ role_path }}/templates/{{ item }}.j2"
        dest: "{{ excalidraw_container_image_self_build_src_files_path }}/{{ item }}"
        mode: "0640"
        owner: "{{ excalidraw_uid }}"
        group: "{{ excalidraw_gid }}"
        force: true # Overwrite the default Dockerfile at https://raw.githubusercontent.com/gchq/Excalidraw/refs/heads/master/Dockerfile
      with_items:
        - .dockerignore
        - Dockerfile
      register: excalidraw_container_image_self_build_files_result

    # See: https://github.com/excalidraw/excalidraw/issues/4993
    # Note: these variables are the ones defined by ansible-role-excalidraw-room
    - name: Replace the value of VITE_APP_WS_SERVER_URL on .env.production with one for self-hosted Excalidraw collaboration server
      when: "excalidraw_room_enabled | default(false) | bool"
      ansible.builtin.replace:
        path: "{{ excalidraw_container_image_self_build_src_files_path }}/.env.production"
        regexp: "VITE_APP_WS_SERVER_URL=https://oss-collab.excalidraw.com"
        replace: "VITE_APP_WS_SERVER_URL={{ excalidraw_room_scheme | default('') }}://{{ excalidraw_room_hostname | default('') }}:{{ excalidraw_room_container_http_port | default('') }}"
      register: excalidraw_container_image_self_build_room_url_result

    # `ansible.builtin.replace` reports success when its pattern matches nothing, and the checkout
    # above is reset from upstream on every run, so a file that came back unchanged means the line
    # this role anchors on is gone. Without this guard, the role would quietly keep building an
    # Excalidraw that still collaborates through oss-collab.excalidraw.com while the operator
    # believes their own collaboration server is the one being used.
    - name: Fail if the value of VITE_APP_WS_SERVER_URL could not be replaced
      when: "excalidraw_room_enabled | default(false) | bool and not excalidraw_container_image_self_build_room_url_result.changed"
      ansible.builtin.fail:
        msg: >-
          `VITE_APP_WS_SERVER_URL=https://oss-collab.excalidraw.com` was not found in
          `{{ excalidraw_container_image_self_build_src_files_path }}/.env.production`.
          Excalidraw seems to have changed how the collaboration server URL is configured,
          so this role can no longer point the build at `excalidraw_room_hostname`.
          Please report this to https://github.com/mother-of-all-self-hosting/ansible-role-excalidraw/issues

    # `rebuild: never` means "build only if this image name does not exist yet". The image name is
    # derived from a git ref (`master` by default) rather than from a version, so it stays the same
    # while what it should contain changes. Everything that can change the contents is therefore
    # listed here explicitly.
    #
    # This used to read `... if a != b | bool else ...`, in which `| bool` binds to `b` alone. The
    # comparison was really `<a git sha, or None on the first run> != False`, which is true every
    # time, so the image was rebuilt and reported as changed on every run - which in turn made
    # `excalidraw_restart_necessary` true and restarted Excalidraw on every playbook run.
    #
    # `excalidraw_git_pull_results.changed` cannot be used in its place: this role writes its own
    # Dockerfile and .dockerignore over the ones upstream ships, so the checkout always has local
    # modifications, and `ansible.builtin.git` reports itself as changed whenever it discards any.
    # `before != after` is what actually says whether upstream moved.
    - name: Ensure Excalidraw container image is built
      community.docker.docker_image_build:
        name: "{{ excalidraw_container_image_self_build_name }}"
        dockerfile: Dockerfile
        path: "{{ excalidraw_container_image_self_build_src_files_path }}"
        pull: true
        rebuild: >-
          {{
            'always'
            if (
              (excalidraw_git_pull_results.before | default(none)) != (excalidraw_git_pull_results.after | default(none))
              or (excalidraw_container_image_self_build_files_result.changed | default(false) | bool)
              or (excalidraw_container_image_self_build_room_url_result.changed | default(false) | bool)
            )
            else 'never'
          }}
      register: excalidraw_container_image_build_result

- name: Ensure Excalidraw container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ excalidraw_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: excalidraw_network_creation_result

- name: Ensure Excalidraw container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ excalidraw_container_network }}
  register: excalidraw_network_creation_result
  changed_when: excalidraw_network_creation_result.rc == 0
  failed_when: excalidraw_network_creation_result.rc != 0 and 'already exists' not in excalidraw_network_creation_result.stderr

- name: Ensure Excalidraw systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/excalidraw.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ excalidraw_identifier }}.service"
    mode: "0644"
  register: excalidraw_systemd_service_result

- name: Determine whether Excalidraw needs a restart
  ansible.builtin.set_fact:
    excalidraw_restart_necessary: >-
      {{
        excalidraw_support_files_result.changed | default(false)
        or excalidraw_systemd_service_result.changed | default(false)
        or excalidraw_container_image_pull_result_ansible_module.changed | default(false)
        or excalidraw_container_image_pull_result_command.changed | default(false)
        or excalidraw_container_image_build_result.changed | default(false)
      }}
