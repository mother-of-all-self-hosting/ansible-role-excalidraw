---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: excalidraw-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        excalidraw_debug_service_enabled: false

        # Variables for Excalidraw
        excalidraw_uid: 1000
        excalidraw_gid: 1000
        excalidraw_scheme: http
        # Never resolved anywhere. It only has to be a value nothing but this
        # scenario would produce, so that verify.yml can recognize it in the
        # Traefik labels the role renders.
        excalidraw_hostname: excalidraw.molecule.invalid

        # Left on here and turned off in the self-build scenario, so that both
        # branches of templates/labels.j2 get exercised. No Traefik is running.
        excalidraw_container_labels_traefik_enabled: true
        excalidraw_container_labels_traefik_entrypoints: web

        # Dictated by the image rather than by the role: Excalidraw's pre-built
        # image is nginx with its stock configuration, listening on port 80.
        # It is spelled out because verify.yml reads it and the role's own
        # default for it is written in terms of another variable.
        excalidraw_container_http_port: 80
        excalidraw_container_http_host_bind_port: 24537

        # Not the role's default, so that verify.yml can tell a value which came
        # from templates/env.j2 from one that merely looks like it did. nginx
        # ignores this variable; the self-build scenario asserts that Static Web
        # Server does not.
        excalidraw_environment_variables_server_log_level: warn

        # Test the pre-built image Excalidraw publishes
        excalidraw_container_image_self_build: false

        # Variables for the verification suite
        excalidraw_molecule_base_url: http://127.0.0.1:24537
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
